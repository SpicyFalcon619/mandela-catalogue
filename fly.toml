# Fly.io config for mandela-catalogue.fly.dev (Singapore). See "Deploying" in the README.
# Deploy with `fly deploy --ha=false`: one machine only. The SQLite volume belongs to one machine, and
# the sign-in and posting rate limits are kept in that machine's memory.

app = 'mandela-catalogue'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  DATABASE_PATH = '/data/mandela.db'
  HOSTNAME = '0.0.0.0'
  PORT = '3000'

# SQLite lives on this volume (encrypted, daily snapshots kept 5 days).
[[mounts]]
  source = 'mandela_data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 3000
  force_https = true
  # Always on: no cold starts, and the in-memory rate limits are not reset by a stop.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/login'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
